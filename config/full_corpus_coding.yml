full_corpus_coding:
  schema_version: full_corpus_coding_v4
  source_document_class: steward_decision

  exclusion_quality_control:
    target_fraction: 0.10
    minimum_per_stratum: 2
    maximum_per_stratum: 8
    hash_salt: f1-stewarding-exclusion-qa-v1

  primary_sessions:
    - Race
    - Sprint

  secondary_sessions:
    - Qualifying
    - Sprint Qualifying
    - Sprint Shootout

  primary_incident_patterns:
    causing_collision:
      - '\bcaus(?:e|ed|ing)\s+(?:a\s+)?collision\b'
      - '\bcollid(?:e|ed|ing)\s+with\b'
      - '\bcars?\s+\d{1,2}\s*(?:&|and)\s*(?:cars?\s+)?\d{1,2}\s+collided\b'
      - '\bcollision\s+with\s+car\b'
      - '\b(?:made|making)\s+contact\s+with\b'
      - '(?<!physical )\bcontact\s+(?:between|with)\b'
      - '\bcar\s+\d{1,2}\s+(?:hit|struck)\s+car\s+\d{1,2}\b'
    forcing_off_track:
      - '\bforc(?:e|ed|ing)\s+(?:another|an?\s+other|a)\s+driver\s+o(?:ff|f)(?:\s+of)?\s+the\s+track\b'
      - '\bforc(?:e|ed|ing)\s+car\s+\d{1,2}\s+off(?:\s+of)?\s+(?:the\s+)?track\b'
      - '\bfail(?:ed|ure)?\s+to\s+leave\s+(?:at\s+least\s+)?(?:a\s+)?car(?:s|\s+width)?\b'
    gaining_advantage_off_track:
      - '\bleav(?:e|es|ing|left)\s+the\s+track\s+and\s+gain(?:ed|ing|s)?\b'
      - '\bleft\s+the\s+track\b.*\bgain(?:ed|ing)\s+(?:a\s+)?(?:lasting\s+)?advantage\b'
      - '\boff\s+the\s+track\s+and\s+gain(?:ed|ing|s)?\s+(?:a\s+)?(?:lasting\s+)?advantage\b'
      - '\bgain(?:ed|ing)\s+(?:a\s+)?(?:lasting\s+)?advantage\s+(?:by|while|after)\s+leav(?:e|ing|left)\b'
    unsafe_rejoin:
      - '\bunsafe\s+re[- ]?join(?:ed|ing)?\b'
      - '\bre[- ]?join(?:ed|ing)?\s+(?:the\s+)?track\s+(?:in\s+an?\s+)?unsafe\b'
      - '\bre[- ]?join(?:ed|ing)?\s+unsafely\b'
    moving_under_braking:
      - '\bmov(?:e|ed|ing)\s+under\s+braking\b'
      - '\bchange(?:d|ing)?\s+direction\s+(?:in|under)\s+the\s+braking\b'
    multiple_defensive_moves:
      - '\bmore\s+than\s+one\s+change\s+of\s+direction\b'
      - '\bmultiple\s+defensive\s+moves?\b'
      - '\bmov(?:e|ed|ing)\s+more\s+than\s+once\s+to\s+defend\b'

  secondary_incident_patterns:
    qualifying_impeding:
      - '\bimped(?:e|ed|ing|iment)\b'

  excluded_offence_patterns:
    pit_lane_speeding:
      - '\bpit\s+lane\s+speed(?:ing|\s+limit)\b'
    technical_nonconformity:
      - '\btechnical\s+non[- ]?compliance\b'
      - '\btechnical\s+non[- ]?conformity\b'
      - '\bcar\s+weight\b'
      - '\bplank\s+assembly\b'
      - '\bfuel\s+sample\b'
    component_or_allocation:
      - '\bpower\s+unit\b'
      - '\bgearbox\b'
      - '\bsurvival\s+cell\b'
      - '\breplacement\s+component\b'
      - '\binternal\s+combustion\s+engine\b'
      - '\bturbo\s+charger\b'
      - '\bmotor\s+generator\s+unit\b'
      - '\benergy\s+store\b'
      - '\bcontrol\s+electronics\b'
      - '\bsecu\b'
      - '\breplacement\s+(?:power\s+unit\s+)?components?\b'
    parc_ferme_or_setup:
      - '\bparc\s+ferm[eé]\b'
      - '\bchanges?\s+made\s+during\s+parc\b'
      - '\bsuspension\s+set[- ]?up\b'
      - '\bbrake\s+map\b'
      - '\bchange\s+of\s+(?:the\s+)?floor\b'
      - '\bfloor\s+(?:has\s+been\s+|was\s+)?changed\b'
    procedural_or_personnel:
      - '\bphysical\s+contact\s+with\s+(?:the\s+)?driver\b'
      - '\bcurfew\b'
      - '\bcufrew\b'
      - '\bpress\s+conference\b'
      - '\bteam\s+personnel\b'
      - '\bdriver\s+change\b'
      - '\bwithdrawal\s+from\s+the\s+event\b'
      - '\bwithdrawal\s+from\s+(?:the\s+)?(?:competition|sprint)\b'
      - '\bdrivers?.{0,2}meeting\b'
      - '\bdrivers?\s+briefing\b'
      - '\bfan\s+engagement\b'
      - '\bmedia\s+(?:commitments?|briefing)\b'
      - '\bwearing\s+of\s+jewellery\b'
      - '\bteam\s+principal\b'
      - '\beye\s*wear\b'
      - '\bcrossing\s+the\s+track\b'
      - '\bphysical\s+assistance\b'
      - '\bunsportsmanlike\s+behaviou?r\b'
      - '\bmedical\s+centre\b'
      - '\bentered\s+the\s+track\s+on\s+foot\b'
      - '\bteam\s+radio\s+communications?\b'
      - '\bteam\s+radio\s+comments?\b'
      - '\btrack\s+invasion\b'
      - '\bsuspension\s+from\s+(?:the\s+)?next\s+competition\b'
      - '\b(?:accrued|accumulated)\s+(?:\d+\s+)?(?:penalty\s+points?|reprimands?)\b'
      - '\bcorrection\s+penalty\s+point\s+total\b'
      - '\bcover\s+on\s+period\b'
      - '\bdecision\s+-\s+car\s+\d{1,2}\s+-\s+withdrawal\b'
    start_or_grid_permission:
      - '\bpermission\s+to\s+start\b'
      - '\bfailure\s+to\s+set\s+a\s+time\s+in\s+qualifying\b'
      - '\bformation\s+of\s+the\s+grid\b'
      - '\brequest\s+(?:for\s+[^.]+\s+)?to\s+start\s+the\s+race\b'
      - '\b107%\s+(?:time|requirement)\b'
    protest_review_or_governance:
      - '\bprotest\b'
      - '\bright\s+of\s+review\b'
      - '\breview\s+of\s+decision\b'
      - '\bappeal\b'
      - '\bre[- ]?scrutineering\b'
      - '\bchange\s+of\s+schedule\b'
      - '\bamended\s+sporting\s+deadlines\b'
      - '\bschedule\s+clarification\b'
      - '\bstewards?\s+panel\b'
      - '\brace\s+distance\b'
      - '\bwaiver\b'
      - '\bwaver\b'
      - '\btrack\s+familiarisation\b'
    routine_track_limits:
      - '\btrack\s+limits?\b'
      - '\bleaving\s+the\s+track\s+without\s+a\s+justifiable\s+reason\b'
      - '\bdid\s+not\s+use\s+the\s+track\s+at\s+all\s+times\b'
      - '\bre[- ]?join(?:ed|ing)?\s+the\s+track\b.*\bbollard\b'
      - '\bstay\s+to\s+the\s+left\s+of\s+the\s+bollard\b'
      - '\bnot\s+re[- ]?join(?:ed|ing)?\s+as\s+instructed\b'
    lap_time_or_delta_procedure:
      - '\bdeleted\s+lap\s+times?\b'
      - '\bsc2\s*[-–]\s*sc1\s+times?\b'
      - '\bfailing\s+to\s+set\s+(?:a\s+)?(?:lap\s+)?time\s+(?:with|within|in)\b'
    pit_lane_procedure:
      - '\bunsafe\s+release\b'
      - '\breleased?\s+in\s+an?\s+unsafe\s+condition\b'
      - '\breleased?\s+from\s+(?:a\s+)?pit\s+stop\s+in\s+an?\s+unsafe\s+condition\b'
      - '\breleased?\s+unsafely\s+from\s+(?:a\s+)?pit\s+stop\b'
      - '\bpit\s+(?:entry|exit|lane\s+incident|lane\s+infringement)\b'
      - '\bcrossing\s+the\s+(?:line\s+at\s+)?pit\s+(?:entry|exit)\b'
      - '\bclosed\s+pit\s+lane\b'
      - '\bpit\s+stop\s+equipment\b'
      - '\bunsafe\s+incident\s+during\s+(?:a\s+)?pit\s+stop\b'
      - '\bequipment\s+in\s+(?:the\s+)?pit\s+lane\b'
      - '\b(?:offence|decision)\s+-\s+car\s+\d{1,2}\s+-\s+pit\s+lane\b'
    neutralization_or_flag_procedure:
      - '\bsafety\s+car\s+procedure\b'
      - '\b(?:virtual\s+)?safety\s+car\s+infringement\b'
      - '\bbehind\s+the\s+safety\s+car\b'
      - '\bovertaking\s+(?:under|during).*safety\s+car\b'
      - '\bovert(?:ake|aking|ook)\b.*\bunder\s+(?:the\s+)?safety\s+car\b'
      - '\bovertaking\s+.*under\s+(?:a\s+)?vsc\b'
      - '\b(?:yellow|red|blue)\s+flags?\b'
      - '\bdouble\s+waved\s+yellow\b'
      - '\bfail(?:ed|ing|ure)?\s+to\s+slow\s+(?:for|under)\s+(?:double\s+)?yellow\b'
      - '\bignoring\s+blue\s+flags?\b'
      - '\bmore\s+than\s+10\s+car\s+lengths?\b'
      - '\bpit\s+lane\s+(?:was\s+)?closed\b'
      - '\bfail(?:ed|ing|ure)?\s+to\s+slow\s+under\s+(?:the\s+)?safety\s+car\b'
      - '\benter(?:ed|ing)\s+(?:the\s+)?pits?\s+during\s+(?:a\s+)?safety\s+car\b'
      - '\bsafety\s+car\s+ecu\s+minimum\s+time\b'
    start_procedure:
      - '\bfalse\s+start\b'
      - '\bincorrect\s+starting\s+(?:position|location)\b'
      - '\bstart(?:ing)?\s+procedure\b'
      - '\baborted\s+start\s+incident\b'
      - '\bmoved\s+before\s+(?:the\s+)?start\s+signal\b'
      - '\bformation\s+lap\b.*\bradio\b'
      - '\bthree\s+minute\s+signal\b'
      - '\bovert(?:ake|aking|ook)\b.*\bformation\s+lap\b'
      - '\bre-establish\s+(?:the\s+)?original\s+start\s+order\b'
      - '\bovertaking\s+before\s+the\s+safety\s+car\s+line\b'
      - '\ball\s+wheels?\s+(?:were\s+)?not\s+fitted\b'
      - '\b(?:3|5|three|five)\s+minute\s+signal\b'
      - '\bout\s+of\s+position\s+at\s+(?:the\s+)?(?:race\s+)?start\b'
      - '\binaccurate\s+start(?:ing)?\s+position\b'
      - '\brolling\s+(?:race\s+)?start\s+infringement\b'
      - '\bdrying\s+the\s+grid\b'
      - '\brace\s+start\s+torque\b'
      - '\btorque\s+in\s+(?:the\s+)?clutch\s+at\s+(?:the\s+)?start\b'
      - '\brace\s+restart\b'
      - '\bpre[- ]race\s+procedure\b'
      - '\bpost[- ]race\s+procedure\b'
      - '\bteam\s+radio\b.*\bformation\s+lap\b'
      - '\bmoved\s+prior\s+to\s+(?:the\s+)?start\s+signal\b'
    race_direction_or_slow_driving:
      - '\bfail(?:ed|ing|ure)?\s+to\s+(?:follow|comply\s+with)\s+(?:the\s+)?race\s+director'
      - '\bdriving\s+unnecessar(?:ily|y)\s+slow(?:ly)?\b'
      - '\berratic\s+driving\b'
      - '\bdriving\s+erratically\b'
      - '\bpotentially\s+dangerous\s+driving\b'
      - '\bdriving\s+(?:a\s+car\s+)?in\s+an?\s+unsafe\s+condition\b'
      - '\bdriving\s+under\s+unsafe\s+conditions?\b'
      - '\balleged\s+unsafe\s+condition\b'
      - '\boffence\s+-\s+car\s+\d{1,2}\s+\(unsafe\s+condition\)\b'
      - '\bcar\s+\d{1,2}\s+\(unsafe\s+condition\)'
      - '\bfailure\s+to\s+follow\s+rd\s+event\s+notes\b'
      - '\bmarshals?\s+were\s+attempting\s+recovery\b'
      - '\bfailure\s+to\s+follow\s+the\s+instructions\s+of\s+relevant\s+officials\b'
      - '\bdrove\s+(?:his|her|the)\s+car\s+across\s+the\s+track\s+into\s+the\s+path\s+of\s+oncoming\s+cars\b'
    sanction_service:
      - '\bfailure\s+to\s+serve\s+a\s+penalty\b'
      - '\bfail(?:ed|ing|ure)?\s+to\s+serve\s+(?:(?:a|the)\s+)?time\s+penalty\b'
      - '\bworked\s+on\b.*\bstop\s*(?:and|&)\s*go\s+penalty\b'
    tyre_fuel_or_scrutineering:
