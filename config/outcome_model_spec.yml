outcome_model_spec:
  schema_version: outcome_model_spec_v1
  unit_of_analysis: one_reviewed_accused_driver_adjudication
  outcome: sanction_outcome
  release_filter: reporting_eligible
  validation_group: event_id
  validation_folds: 5
  random_seed: 20260812

  consistency_model:
    categorical_covariates:
      - incident_family
      - season
    numeric_covariates: []
    binary_covariates:
      - multi_party
    regularization: l2
    inverse_regularization_strength: 1.0
    primary_metric: brier_score
    baseline: training_fold_prevalence
    calibration_bins: 10
    required_sensitivity: leave_one_season_out

  nationality_model:
    primary_exposure: british_accused_driver
    categorical_covariates:
      - incident_family
      - season
    numeric_covariates: []
    binary_covariates:
      - multi_party
      - home_race_accused
    overlap_weights: overlap
    propensity_clip: [0.01, 0.99]
    common_support_required: true
    report_effect_scale: average_marginal_risk_difference
    simulation_power:
      baseline_probabilities: [0.50, 0.70]
      target_risk_differences: [0.05, 0.10, 0.15, 0.20]
      event_random_intercept_sd: 0.35
      repetitions: 500
      alpha: 0.05
      minimum_successful_fit_fraction: 0.90
      target_power: 0.80

  safeguards:
    exclude_penalty_fields_from_predictors: true
    exclude_decision_reason_from_primary_predictors: true
    prohibit_driver_fixed_effect_with_nationality_exposure: true
    prohibit_random_row_splits: true
    context_enrichment_required_before_inference: true
    provisional_labels_allowed_for_effect_estimation: false
