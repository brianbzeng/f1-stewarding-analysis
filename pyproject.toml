[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "f1-stewards"
version = "0.1.0"
description = "Auditable Formula One stewarding analytics pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "duckdb>=1.1,<2",
  "fastf1>=3.6,<4",
  "httpx>=0.27,<1",
  "pandas>=2.2,<4",
  "pyarrow>=17,<24",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "python-dateutil>=2.9,<3",
  "PyYAML>=6,<7",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
analysis = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.3,<5",
  "matplotlib>=3.9,<4",
  "nbformat>=5.10,<6",
  "plotly>=5.24,<7",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "statsmodels>=0.14,<1",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
f1stewards = "f1stewards.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/f1stewards"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest_tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
